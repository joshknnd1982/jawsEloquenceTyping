name = jawsEloquenceTyping
summary = "JAWS-style Eloquence typing"
description = "Provides runtime-only JAWS-style Eloquence feedback without changing NVDA configuration: capital letters use an adjustable pitch offset. Isolated punctuation (question marks periods exclamation points commas semicolons and colons) reached while typing or navigating by character uses Eloquence's native prosody with JAWS-style wording. Each fix is independently toggleable in Settings."
author = "Codex, created for jcoff"
version = 2.5.2
url = https://github.com/joshknnd1982/jawsEloquenceTyping
changelog = "Checks GitHub for updates. Once a day, a little after NVDA starts, the add-on asks github.com/joshknnd1982/jawsEloquenceTyping whether a newer version has been released, and says nothing unless there is one. When there is, a dialog shows what's new and offers to download and install it; the download must match the release's SHA-256 checksum, and NVDA asks you to confirm the installation. To check yourself, choose Tools, Check for add-on updates, JAWS-style Eloquence typing in the NVDA menu, or press Check for updates now in the JAWS Eloquence Typing settings panel, where the daily check can also be turned off. Typing feedback is unchanged."
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.1
docFileName = readme.html
