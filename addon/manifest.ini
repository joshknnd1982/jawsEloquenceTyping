name = jawsEloquenceTyping
summary = "JAWS-style Eloquence typing"
description = "Provides runtime-only JAWS-style Eloquence feedback without changing NVDA configuration: capital letters use an adjustable pitch offset. Isolated punctuation (question marks periods exclamation points commas semicolons and colons) reached while typing or navigating by character uses Eloquence's native prosody with JAWS-style wording. Each fix is independently toggleable in Settings."
author = "Codex, created for jcoff"
version = 2.5.1
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.1
docFileName = readme.html
